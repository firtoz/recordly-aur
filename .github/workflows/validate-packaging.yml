name: Validate packaging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:32c78c548c1a3f9db43bc25fb9f47d8bf5efff49a1da3810bb60790b4202d657
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git curl unzip

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use patched project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check helper types
        run: bun run typecheck

      - name: Audit helper dependencies
        run: bun audit

      - name: Check AUR pkgver vs GitHub releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="${HOME}/.bun/bin:${PATH}"
          cd "${GITHUB_WORKSPACE}" && bun run check-aur-vs-latest

      - name: Non-root user for makepkg
        run: |
          if ! id builder >/dev/null 2>&1; then
            useradd -m -s /bin/bash builder
          fi
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Verify PKGBUILD sources
        run: |
          export PATH="${HOME}/.bun/bin:${PATH}"
          runuser -u builder -- env HOME="${HOME}" PATH="${PATH}" \
            bash -lc "cd \"${GITHUB_WORKSPACE}\" && bun run verify-packaging"

      # Run as root (not builder): GITHUB_STEP_SUMMARY is only writable by the runner user.
      - name: Audit AUR vs upstream (job summary)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="${HOME}/.bun/bin:${PATH}"
          cd "${GITHUB_WORKSPACE}" && bun run audit-upstream
